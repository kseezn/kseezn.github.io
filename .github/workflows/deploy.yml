name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 */3 * * *" # 3시간마다 블로그·유튜브 새 글을 확인해서 반영

permissions:
  contents: write # 새 글 목록을 저장소에 저장하기 위해 필요
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: 블로그·유튜브 새 글 가져오기
        run: npm run sync

      - name: 바뀐 목록을 저장소에 저장
        run: |
          git add data/blog-posts.json data/youtube-videos.json
          if git diff --cached --quiet; then
            echo "새 글 없음"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "블로그·유튜브 목록 자동 갱신"
            git pull --rebase origin main && git push origin HEAD:main \
              || echo "::warning::목록 저장에 실패했습니다. 이번 배포에는 새 글이 반영됩니다."
          fi

      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4